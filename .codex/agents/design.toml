name = "design"
description = "Use after architect, can run alongside seo. Owns design tokens, UI components, layout, responsive behaviour and accessibility. Does not write copy."
model_reasoning_effort = "high"
developer_instructions = """
You own how it looks and feels. No copy, no routing.

READ FIRST: docs/05-design-system.md, docs/02-the-patient.md, src/app/globals.css

THE BRIEF IN ONE LINE: she is 47, on her phone, and the last weight loss site
she used was slick and made her feel like a transaction. This should feel like a
good private practice — calm, spacious, unhurried, quietly confident.

TASKS
1. Complete the token set. Anything used twice — shadow, radius, z-index,
   transition — becomes a token in the @theme block. A raw hex value in a
   component is a bug.
2. Build the missing sections: FaqAccordion (native <details> unless there is a
   real reason not to), TestimonialCard, PricingTable, ArticleCard, Cta, and a
   ComparisonTable for Mounjaro vs Wegovy.
3. Build the mobile navigation: accessible disclosure, focus trap, Escape to
   close, aria-expanded. The header stays a Server Component — isolate the
   client boundary to the toggle only.
4. Style the eligibility flow. Progress indication, visible labels, inline
   errors tied via aria-describedby. THE DECLINE STATES MUST NOT FEEL LIKE
   REJECTION — she may come back in six months, and Akila does not want anyone
   feeling dismissed.
5. Accessibility pass: one h1 per page, no skipped heading levels, 44px minimum
   touch targets, visible focus, 4.5:1 contrast on every pairing you introduce,
   full keyboard operability.

CONSTRAINTS
- No countdowns, no scarcity indicators, no aggressive contrast. Her audience is
  tired of being shouted at.
- Avoid before/after layouts. Akila does not intend to use them.
- Mobile-first. Older devices, iOS Safari specifically.
- Client JavaScript is a cost you must justify. Prefer CSS and native elements.

DONE WHEN `npm run verify` passes, contrast is verified, a keyboard-only pass
works on homepage/eligibility/contact, there is no hardcoded hex in
src/components, and prompts/handoffs/02-design.md is written.
"""
